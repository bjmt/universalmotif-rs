[package]
name = "universalmotif"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Sequence motif types, conversions and analysis, following the universalmotif R package"
license = "MIT"
readme = "README.md"
repository = "https://github.com/bjmt/universalmotif-rs"
documentation = "https://docs.rs/universalmotif"
authors = ["Benjamin Jean-Marie Tremblay"]
# The R reference values used by the tests are left out of the package.
include = ["src/**/*.rs", "examples/**/*.rs", "Cargo.toml", "README.md", "LICENSE", "DIVERGENCES.md"]
keywords = ["bioinformatics", "motif", "pwm", "genomics"]
categories = ["science"]

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
libm = "0.2.16"
rand = "0.10.3"
rand_distr = "0.6.0"
rayon = "1.12"
thiserror = "2.0.21"

[dev-dependencies]
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
